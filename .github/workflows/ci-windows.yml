name: Windows

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
    branches: [ main ]

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows with MSVC
          - name: "Windows MSVC"
            compiler: msvc
            cmake-generator: ''
            cmake-options: '-DSOUNDCOE_BUILD_TESTS=ON'
            
          # Windows with MinGW (GCC)
          - name: "Windows MinGW"
            compiler: gcc
            cmake-generator: 'MinGW Makefiles'
            cmake-options: '-DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DSOUNDCOE_BUILD_TESTS=ON'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        submodules: 'recursive'

    - name: Install Windows build tools
      if: matrix.compiler != 'msvc'
      run: |
        if [ "${{ matrix.compiler }}" == "clang" ]; then
          choco install ninja
        elif [ "${{ matrix.compiler }}" == "gcc" ]; then
          choco install mingw
        fi
      shell: bash


    - name: Configure CMake
      run: |
        if [ -n "${{ matrix.cmake-generator }}" ]; then
          cmake -B build -G "${{ matrix.cmake-generator }}" ${{ matrix.cmake-options }}
        else
          cmake -B build ${{ matrix.cmake-options }}
        fi
      shell: bash

    - name: Build
      run: |
        cmake --build build --config Release

    - name: Run tests (math only - no audio hardware in CI)
      working-directory: build
      run: |
        echo "Running math tests (no audio hardware available in CI)"
        if [ "${{ matrix.compiler }}" == "gcc" ]; then
            cd tests
            ./soundcoe_tests.exe --suite=Vec3Tests
            ./soundcoe_tests.exe --suite=MathTests
        else # MSVC
            ./tests/Release/soundcoe_tests.exe --suite=Vec3Tests
            ./tests/Release/soundcoe_tests.exe --suite=MathTests
        fi
      shell: bash