name: macOS

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
    branches: [ main ]

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: macos-latest
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "macOS Clang"
            compiler: clang
            cmake-generator: 'Ninja'
            cmake-options: '-DSOUNDCOE_BUILD_TESTS=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        submodules: 'recursive'

    - name: Install ninja-build
      run: |
        brew install ninja
      shell: bash

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ccache-${{ runner.os }}-${{ matrix.compiler }}-${{ hashFiles('cmake/openal_soft.cmake', 'tests/CMakeLists.txt') }}
        restore-keys: ccache-${{ runner.os }}-${{ matrix.compiler }}-

    - name: Configure CMake
      run: |
        cmake -B build -G "${{ matrix.cmake-generator }}" ${{ matrix.cmake-options }} -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: |
        cmake --build build --config Release --parallel

    - name: Run tests
      working-directory: build
      run: |
        ./tests/soundcoe_tests
      shell: bash