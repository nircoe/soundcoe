name: Linux

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
    branches: [ main ]

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    env:
      COMMON_CMAKE_FLAGS: >-
        -DCMAKE_BUILD_TYPE=Release
        -DSOUNDCOE_BUILD_TESTS=ON
        -DSOUNDCOE_USE_LOGCOE=ON
        -DSOUNDCOE_ONLY_NULL_BACKEND=ON
        -DCMAKE_C_COMPILER_LAUNCHER=ccache
        -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      ALSOFT_DRIVERS: 'null'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Linux GCC"
            compiler: gcc
            cmake-generator: 'Ninja'
            cmake-options: '-DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++'

          - name: "Linux Clang"
            compiler: clang
            cmake-generator: 'Ninja'
            cmake-options: '-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        submodules: 'recursive'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build
      shell: bash

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ccache-${{ runner.os }}-${{ matrix.compiler }}-${{
          hashFiles('cmake/openal_soft.cmake', 'cmake/logcoe.cmake', 'tests/CMakeLists.txt') }}
        restore-keys: ccache-${{ runner.os }}-${{ matrix.compiler }}-

    - name: Configure CMake
      run: |
        cmake -B build -G "${{ matrix.cmake-generator }}" ${{ matrix.cmake-options }} ${{ env.COMMON_CMAKE_FLAGS }}

    - name: Build
      run: |
        cmake --build build --config Release --parallel

    - name: Run tests
      working-directory: build
      run: |
        ./tests/soundcoe_tests
      shell: bash