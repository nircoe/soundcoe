name: Windows

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
    branches: [ main ]

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    env:
      COMMON_CMAKE_FLAGS: '-DCMAKE_BUILD_TYPE=Release -DSOUNDCOE_BUILD_TESTS=ON'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Windows MSVC"
            compiler: msvc
            cmake-generator: 'Ninja'
            cmake-options: '-DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl'
            cache-cmake-options: >-
              -DCMAKE_C_COMPILER_LAUNCHER=sccache
              -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
              -DCMAKE_POLICY_DEFAULT_CMP0141=NEW
              -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded

          - name: "Windows MinGW"
            compiler: gcc
            cmake-generator: 'MinGW Makefiles'
            cmake-options: '-DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++'
            cache-cmake-options: '-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        submodules: 'recursive'

    - name: Get MinGW version
      id: mingw-version
      if: matrix.compiler == 'gcc'
      run: echo "version=$(choco search mingw --exact --limit-output | cut -d'|' -f2)" >> $GITHUB_OUTPUT
      shell: bash

    - name: Cache MinGW toolchain
      id: mingw-cache
      if: matrix.compiler == 'gcc'
      uses: actions/cache@v4
      with:
        path: C:\mingw64
        key: mingw-${{ runner.os }}-${{ steps.mingw-version.outputs.version }}

    - name: Install MinGW
      if: matrix.compiler == 'gcc' && steps.mingw-cache.outputs.cache-hit != 'true'
      run: choco install mingw
      shell: bash

    - name: Add MinGW to PATH
      if: matrix.compiler == 'gcc'
      run: echo "C:\mingw64\bin" >> $GITHUB_PATH
      shell: bash

    - name: Setup MSVC dev environment
      if: matrix.compiler == 'msvc'
      uses: ilammy/msvc-dev-cmd@v1.13.0

    - name: Setup ccache
      if: matrix.compiler == 'gcc'
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ccache-${{ runner.os }}-${{ matrix.compiler }}-${{ hashFiles('cmake/openal_soft.cmake', 'tests/CMakeLists.txt') }}
        restore-keys: ccache-${{ runner.os }}-${{ matrix.compiler }}-

    - name: Setup sccache
      if: matrix.compiler == 'msvc'
      uses: mozilla-actions/sccache-action@v0.0.11

    - name: Set sccache env vars
      if: matrix.compiler == 'msvc'
      run: echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
      shell: bash

    - name: Configure CMake
      run: |
        cmake -B build -G "${{ matrix.cmake-generator }}" \
          ${{ matrix.cmake-options }} ${{ matrix.cache-cmake-options }} \
          ${{ env.COMMON_CMAKE_FLAGS }}
      shell: bash

    - name: Build
      run: |
        cmake --build build --config Release --parallel

    - name: Run tests (math only - no audio hardware in CI)
      working-directory: build
      run: |
        echo "Running math tests (no audio hardware available in CI)"
        ./tests/soundcoe_tests.exe --suite=Vec3Tests
        ./tests/soundcoe_tests.exe --suite=MathTests
      shell: bash
